[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "medcover"
version = "0.1.0"
description = "Medicare Coverage Medallion RAG pipeline (Bronze -> Silver -> Gold -> S3 WAP -> ECS Fargate FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "boto3>=1.35.0",
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "fastembed>=0.4.2",
    "httpx>=0.27.2",
    "markdownify>=0.13.1",
    "pandas>=2.2.3",
    "pandera>=0.20.4",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.3.241009",
    "pytest>=8.3.3",
    "respx>=0.21.1",
    "ruff>=0.7.0",
    "sqlfluff>=3.2.5",
    "types-beautifulsoup4>=4.12.0.20241020",
]

[project.scripts]
medcover = "medcover.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medcover"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
